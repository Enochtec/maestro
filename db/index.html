<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <meta name="application-name" content="Maestro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maestro" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Maestro Platform</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090d;
        --panel: rgba(17, 19, 26, 0.86);
        --text: #f3efe7;
        --muted: #a9a39c;
        --accent: #2fbf71;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at top, rgba(47, 191, 113, 0.12), transparent 42%), var(--bg);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--bg);
      }

      .loading-mask {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(8, 9, 13, 0.98), rgba(8, 9, 13, 0.94));
        color: var(--text);
        z-index: 2;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      .loading-mask.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .card {
        min-width: min(90vw, 360px);
        padding: 20px 22px;
        border-radius: 22px;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        text-align: center;
        backdrop-filter: blur(22px);
      }

      .brand {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        margin: 0 auto 14px;
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), transparent 42%), var(--accent);
        display: grid;
        place-items: center;
        color: #08090d;
        font-weight: 900;
        font-size: 1.5rem;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.3;
        color: var(--text);
      }

      p {
        margin: 8px 0 0;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--muted);
      }

      .spinner {
        width: 38px;
        height: 38px;
        margin: 18px auto 0;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <iframe
      class="app-frame"
      src="https://maestro-l6eu.onrender.com/"
      title="Maestro Platform"
      allow="fullscreen; autoplay; clipboard-write; encrypted-media; geolocation; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager"
    ></iframe>

    <div class="loading-mask" id="loadingMask">
      <div class="card">
        <div class="brand">M</div>
        <h1>Maestro is loading</h1>
        <p>Opening the platform in app view.</p>
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </div>

    <script>
      (() => {
        const iframe = document.querySelector('.app-frame')
        const loadingMask = document.getElementById('loadingMask')

        const hideMask = () => {
          if (!loadingMask) return
          loadingMask.classList.add('hidden')
          setTimeout(() => loadingMask.remove(), 240)
        }

        if (iframe) {
          iframe.addEventListener('load', hideMask, { once: true })
          iframe.addEventListener('error', hideMask, { once: true })
        }

        setTimeout(hideMask, 2200)

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {
              void 0
            })
          })
        }
      })()
    </script>
  </body>
</html>
